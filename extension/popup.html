<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Hola</title>
    <style>
      :root { color: #030050; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { margin: 0; width: 300px; background: #f6f5fa; }
      main { padding: 16px; }
      .logo { font: 700 22px/1 Lato, system-ui, sans-serif; letter-spacing: -0.5px; margin: 0 0 14px; }
      .row { display: grid; grid-template-columns: 1fr 40px; grid-template-rows: auto auto; column-gap: 8px; row-gap: 10px; align-items: end; }
      .row > div { grid-column: 1; }
      #swap { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
      label { display: block; font-size: 12.5px; font-weight: 600; color: #5e5c75; margin: 0 0 4px 4px; }
      select { width: 100%; height: 40px; border-radius: 999px; border: 0; padding: 0 10px; font: inherit; font-weight: 600;
        color: #030050; background: #fff; box-shadow: 0 1px 3px rgb(3 0 80 / .08); }
      #swap { width: 40px; height: 40px; border-radius: 999px; border: 0; background: #030050; color: #fff; font-size: 18px; cursor: pointer; transform: rotate(90deg); }
      #go { margin-top: 14px; width: 100%; height: 44px; border: 0; border-radius: 999px; background: #030050; color: #fff;
        font: 700 15px system-ui, sans-serif; cursor: pointer; }
      #go:disabled { opacity: .6; cursor: default; }
      #status { min-height: 1.4em; margin: 10px 4px 0; font-size: 13.5px; color: #2e2c4d; }
      #open { display: block; margin: 8px 4px 0; font-size: 13px; color: #5e5c75; }
      :focus-visible { outline: 3px solid #030050; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="logo">hola</p>
      <div class="row">
        <div>
          <label id="from-label" for="from">De</label>
          <select id="from"></select>
        </div>
        <div>
          <label id="to-label" for="to">A</label>
          <select id="to"></select>
        </div>
        <button id="swap" type="button" aria-label="Intercambiar">⇄</button>
      </div>
      <button id="go" type="button">Traducir página</button>
      <p id="status" role="status" aria-live="polite"></p>
      <a id="open" href="https://hola-sepia-six.vercel.app" target="_blank" rel="noreferrer">Abrir Hola</a>
    </main>
    <script src="dist/popup.js"></script>
  </body>
</html>
